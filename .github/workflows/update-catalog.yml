name: Update app catalog
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: update-app-catalog
  cancel-in-progress: false
jobs:
  update:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Validate released packages and update catalog
        run: python3 scripts/update_catalog.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- repo.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json
          git commit -m 'Update app catalog from published release'
          git push origin HEAD:main
